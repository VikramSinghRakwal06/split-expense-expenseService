# Local development profile.
# Every value still resolves from an env var first, so a developer can point at a different
# database or a group-service running elsewhere without editing this file.
spring:
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Convenient locally: lets you wipe and re-migrate a scratch database.
    clean-disabled: false

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.splitexpense.expense: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    # Makes breaker state changes and retry attempts against group-service visible while
    # working on the saga.
    io.github.resilience4j: DEBUG
